[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "abstraction-job"
version = "0.1.0"
description = "Durable work, and the rules for taking ownership of it. A record on disk, and who may hold it now."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["abstraction-cas>=0.1,<0.2", "abstraction-watch>=0.1,<0.2"]

[project.urls]
Source = "https://github.com/openabstractions/abstraction-job"

[tool.setuptools]
py-modules = ["abstraction_job"]
