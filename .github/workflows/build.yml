name: build

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  schedule:
    - cron: '35 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # The macOS arm64 image carries Go in the tool cache only, so it is on
      # PATH on ubuntu and windows and absent here until an action places it.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          go version
          go env CGO_ENABLED GOTOOLCHAIN GOFLAGS

      # No go.work here on purpose. The requires in go/go.mod resolve from the
      # module proxy at the versions this repository pins, which is the only
      # route a stranger has. If a pin is older than the API these sources
      # call, this step is where that shows.
      - name: build and test
        working-directory: go
        run: |
          go build ./...
          n=$(go list -f '{{if .TestGoFiles}}x{{end}}' ./... | grep -c x || true)
          if [ "$n" -lt 1 ]; then
            printf 'FAIL  no package in this module has a test file, and go test calls that a pass\n'
            exit 1
          fi
          go test -count=1 ./...
          printf '%s: %s go packages with tests, resolved as an adopter resolves them\n' \
            "$RUNNER_OS" "$n" >> "$GITHUB_STEP_SUMMARY"

      - name: race
        working-directory: go
        run: |
          if [ "$(go env CGO_ENABLED)" != "1" ]; then
            printf 'UNPROVEN  race detector — CGO_ENABLED=0, no C compiler for go env CC=%s\n' "$(go env CC)"
            printf '%s: UNPROVEN race detector, CGO_ENABLED=0\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go test -race -count=1 ./...
          printf '%s: go tests under the race detector\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"

  acceptance:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # The generated acceptance vocabulary: python/test_acceptance.py reads
      # the corpus through the Python codec and, with OA_ACCEPTANCE_CPP set,
      # through the C++ codec driver as well. Standard library only in both.
      - name: compile the C++ codec driver and run the acceptance corpus
        run: |
          PY="$(command -v python3 || command -v python || true)"
          CXX="$(command -v g++ || command -v clang++ || true)"
          if [ -z "$PY" ] || [ -z "$CXX" ]; then
            printf 'UNPROVEN  acceptance on %s — python=%s c++=%s\n' "$RUNNER_OS" "${PY:-none}" "${CXX:-none}"
            printf '%s: UNPROVEN acceptance, missing python or c++\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$PY" --version
          "$CXX" --version | head -1
          out=codec
          static=""
          if [ "$RUNNER_OS" = Windows ]; then
            out=codec.exe
            # Git Bash puts its own mingw64\bin ahead of the runner's C:\mingw64\bin,
            # so a dynamically linked binary loads Git's older libstdc++-6.dll and
            # dies in the loader before main: no output, no message, exit 127.
            case "$("$CXX" --version | head -1)" in *g++*) static=-static ;; esac
          fi
          "$CXX" -std=c++17 cpp/test/test_acceptance_codec.cpp -o "$out" $static
          export OA_ACCEPTANCE_CPP="$PWD/$out"
          (cd python && "$PY" -m unittest -v test_acceptance) 2>&1 | tee out.txt
          if grep -q '^Ran 0 tests' out.txt; then
            printf 'FAIL  discovery found no test to run, and unittest calls that a pass\n'
            exit 1
          fi
          grep -q '^OK' out.txt || exit 1
          printf '%s: acceptance corpus, %s tests, python codec and c++ driver %s\n' \
            "$RUNNER_OS" "$(sed -n 's/^Ran \([0-9]*\) tests\?.*/\1/p' out.txt | tail -1)" "$("$CXX" --version | head -1)" >> "$GITHUB_STEP_SUMMARY"

  unproven:
    needs: [go, acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: what this workflow did not run
        run: |
          {
            printf '\n### UNPROVEN\n\nThis workflow builds what this repository contains, and nothing else. It ran none of:\n\n'
            printf -- '- the conformance harnesses, which live in the private tree\n'
            printf -- '- MSVC. The acceptance job takes whichever of g++ or clang++ is on PATH, and this does not re-measure MSVC\n'
            printf -- '- any signed or installed artefact\n'
          } >> "$GITHUB_STEP_SUMMARY"
